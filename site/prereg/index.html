<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>事前登録受付中の新作ゲーム｜GameLab Radar</title>
  <meta name="description" content="事前登録・予約注文を受け付けている新作スマホゲームの一覧。配信予定日、事前登録者数、登録特典をまとめてチェックできます。">
  <meta property="og:title" content="事前登録受付中の新作ゲーム｜GameLab Radar">
  <meta property="og:description" content="事前登録受付中の新作ゲームを、配信予定日・特典とあわせてチェック。">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://gamelab.main.jp/prereg/">
  <meta property="og:site_name" content="GameLab Radar">
  <link rel="canonical" href="https://gamelab.main.jp/prereg/">
<!--#include head -->
</head>
<body data-page="prereg" data-base="../">
<!--#include header -->

  <div class="page" id="main">
    <div class="wrap layout">
      <main class="main-col">
        <section class="panel">
          <nav class="crumbs" aria-label="パンくずリスト"><a href="../">トップ</a><span>事前登録</span></nav>
          <h1 class="page-title">事前登録受付中の新作ゲーム</h1>
          <p class="page-lead">配信日が近いタイトルから並べています。</p>

          <div class="chips" id="dateFilters" role="group" aria-label="絞り込み"></div>
          <p class="result-line" id="countLine"></p>
          <div class="card-grid cols-3" id="preregGrid"></div>
          <p class="note-text">配信予定日は App Store の予約ページ、または各メディアの記事で発表された日付です。「事前登録」が灰色のタイトルは App Store で確認できていないもの（Android 先行など）です。</p>
        </section>
      </main>

      <aside class="side-col" aria-label="サイドメニュー">
        <section class="side-box" id="sideSchedule"></section>
        <section class="side-box" id="ranking" hidden></section>
      </aside>
    </div>
  </div>

<!--#include footer -->

  <script src="../assets/common.js"></script>
  <script src="prereg.js"></script>
</body>
</html>
