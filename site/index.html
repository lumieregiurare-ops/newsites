<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GameLab Radar｜新作ゲームのニュース・発売スケジュール・事前登録情報</title>

  <meta property="og:title" content="GameLab Radar｜新作ゲームのニュース・発売スケジュール・事前登録情報">

  <link rel="canonical" href="https://gamelab.main.jp/">
<!--#include head -->
</head>
<body data-page="home" data-base="">
<!--#include header -->

  <div class="page" id="main">
    <div class="wrap layout">
      <main class="main-col">
        <h1 class="sr-only">GameLab Radar 新作ゲームニュース</h1>

        <section aria-label="注目ニュース">
          <div class="pickup" id="pickup"></div>
        </section>

        <section class="panel" aria-labelledby="latestTitle">
          <div class="sec-head">
            <h2 class="sec-title" id="latestTitle">最新ニュース</h2>
            <a class="sec-more" href="radar/">ニュース一覧</a>
          </div>
          <div id="latest"><p class="list-empty">読み込み中…</p></div>
          <div class="more-row"><a class="btn-more" href="radar/">ニュースをもっと見る</a></div>
        </section>

        <section class="panel" aria-labelledby="platformTitle">
          <div class="sec-head">
            <h2 class="sec-title" id="platformTitle">機種別の新着</h2>
            <a class="sec-more" id="platformMore" href="radar/">もっと見る</a>
          </div>
          <div class="tabs" id="platformTabs" role="tablist"></div>
          <div class="mini-grid" id="platformList"></div>
        </section>

        <section class="panel" aria-labelledby="preregTitle">
          <div class="sec-head">
            <h2 class="sec-title" id="preregTitle">事前登録受付中</h2>
            <a class="sec-more" href="prereg/">すべて見る</a>
          </div>
          <div class="card-grid" id="preregGrid"></div>
        </section>
      </main>

      <aside class="side-col" aria-label="サイドメニュー">
        <section class="side-box" id="sideSchedule"></section>
        <section class="side-box" id="ranking" hidden></section>
        <section class="side-box" id="sideChanges"></section>
        <section class="side-box" id="sideCats"></section>
      </aside>
    </div>
  </div>

<!--#include footer -->

  <script src="assets/common.js"></script>
  <script src="assets/top.js"></script>
</body>
</html>
