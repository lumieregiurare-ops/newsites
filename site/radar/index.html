<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ニュース一覧｜GameLab Radar</title>
  <meta name="description" content="新作ゲームのニュース一覧。Nintendo Switch・PlayStation・Xbox・PC・スマホの機種別、ティザー・事前登録・発売・イベント・周年などのジャンル別に新着情報をチェックできます。">
  <meta property="og:title" content="ニュース一覧｜GameLab Radar">
  <meta property="og:description" content="新作ゲームのニュースを機種別・ジャンル別にチェック。">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://gamelab.main.jp/radar/">
  <meta property="og:site_name" content="GameLab Radar">
  <link rel="canonical" href="https://gamelab.main.jp/radar/">
<!--#include head -->
</head>
<body data-page="news" data-base="../">
<!--#include header -->

  <div class="page" id="main">
    <div class="wrap layout">
      <main class="main-col">
        <section class="panel">
          <nav class="crumbs" aria-label="パンくずリスト"><a href="../">トップ</a><span id="crumbTail">ニュース</span></nav>
          <h1 class="page-title" id="pageTitle">ニュース</h1>

          <div class="tabs" id="platformTabs" role="tablist" aria-label="機種"></div>

          <div class="filter-bar" id="toolbar">
            <input type="search" id="searchInput" placeholder="キーワードで絞り込み" aria-label="キーワードで絞り込み" autocomplete="off">
            <label class="field">ジャンル
              <select id="categorySelect"><option value="all">すべて</option></select>
            </label>
            <label class="field">期間
              <select id="periodSelect">
                <option value="all">すべて</option>
                <option value="1">24時間以内</option>
                <option value="7">1週間以内</option>
                <option value="30">1か月以内</option>
              </select>
            </label>
            <label class="field">地域
              <select id="regionSelect">
                <option value="all">すべて</option>
                <option value="jp">国内</option>
                <option value="global">海外</option>
              </select>
            </label>
            <label class="field">掲載元
              <select id="sourceSelect"><option value="all">すべて</option></select>
            </label>
            <button class="btn-line" id="favToggle" type="button" aria-pressed="false">★ お気に入り <span id="favCount">0</span></button>
          </div>

          <div class="result-line">
            <span id="resultCount"></span>
            <div class="fav-tools" id="favTools" hidden>
              <button class="btn-line" id="exportFav" type="button">書き出す</button>
              <label class="btn-line">読み込む<input type="file" id="importFav" accept="application/json" hidden></label>
              <span>お気に入りはこのブラウザにだけ保存されます</span>
            </div>
          </div>

          <div id="list" aria-live="polite"><p class="list-empty">読み込み中…</p></div>
          <nav class="pager" id="pager" aria-label="ページ"></nav>
        </section>
      </main>

      <aside class="side-col" aria-label="サイドメニュー">
        <section class="side-box" id="sideCats"></section>
        <section class="side-box" id="sideSources"></section>
        <section class="side-box" id="ranking" hidden></section>
      </aside>
    </div>
  </div>

<!--#include footer -->

  <script src="../assets/common.js"></script>
  <script src="app.js"></script>
</body>
</html>
