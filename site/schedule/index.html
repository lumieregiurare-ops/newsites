<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>発売スケジュール｜GameLab Radar</title>
  <meta name="description" content="Nintendo Switch / Switch 2・PlayStation・Xbox・PC（Steam）・スマホの新作ゲーム発売スケジュール。発売日の決定・延期などの変更履歴も掲載しています。">
  <meta property="og:title" content="発売スケジュール｜GameLab Radar">
  <meta property="og:description" content="新作ゲームの発売予定と、発売日の変更履歴。">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://gamelab.main.jp/schedule/">
  <meta property="og:site_name" content="GameLab Radar">
  <link rel="canonical" href="https://gamelab.main.jp/schedule/">
<!--#include head -->
</head>
<body data-page="schedule" data-base="../">
<!--#include header -->

  <div class="page" id="main">
    <div class="wrap layout">
      <main class="main-col">
        <section class="panel" id="releases">
          <nav class="crumbs" aria-label="パンくずリスト"><a href="../">トップ</a><span>発売スケジュール</span></nav>
          <h1 class="page-title">発売スケジュール</h1>
          <p class="page-lead">今後 4 か月の新作ゲームの発売日です。時期だけが発表されているタイトルは月末にまとめています。</p>

          <div class="tabs" id="platformTabs" role="tablist" aria-label="機種"></div>
          <div class="chips" id="sourceFilters" role="group" aria-label="情報源"></div>
          <p class="result-line" id="countLine"></p>

          <div id="scheduleList"><p class="list-empty">読み込み中…</p></div>
          <div class="more-row"><button class="btn-more" id="scheduleMore" type="button" hidden></button></div>
          <p class="note-text">発売日は各社の発表・ストアの掲載情報にもとづいています。変更されることがあるため、購入の際は公式情報をご確認ください。</p>
        </section>

        <section class="panel" id="changes">
          <div class="sec-head">
            <h2 class="sec-title">発売日・事前登録の動き<small>直近 30 日</small></h2>
          </div>
          <ul class="changes" id="changesList"></ul>
        </section>
      </main>

      <aside class="side-col" aria-label="サイドメニュー">
        <section class="side-box" id="sidePrereg"></section>
        <section class="side-box" id="ranking" hidden></section>
      </aside>
    </div>
  </div>

<!--#include footer -->

  <script src="../assets/common.js"></script>
  <script src="schedule.js"></script>
</body>
</html>
