# 毎日 1 回収集を実行し、docs/ を更新してコミットする（GitHub Pages は docs/ を配信）
name: collect

on:
  schedule:
    - cron: "0 22 * * *" # JST 07:00
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Collect
        run: node scripts/collect.mjs
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/radar/data/sites.json docs/data/schedule.json data/state.json
          git diff --cached --quiet && echo "no changes" && exit 0
          git commit -m "chore: daily collect $(date -u +%Y-%m-%d)"
          git push
      # GITHUB_TOKEN による push は deploy ワークフローを起動しないので、ここでもアップロードする
      - name: Upload docs/ to Lolipop (FTP)
        if: ${{ vars.DEPLOY_TARGET == 'lolipop' }}
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.LOLIPOP_FTP_SERVER }}
          username: ${{ secrets.LOLIPOP_FTP_USER }}
          password: ${{ secrets.LOLIPOP_FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./docs/
          server-dir: ./
          dangerous-clean-slate: false
