# 毎日 1 回収集を実行し、docs/ を更新してコミットする（GitHub Pages は docs/ を配信）
name: collect

on:
  schedule:
    # ニュースサイトの RSS は直近 100 件しか持たないので、日中は 2 時間おきに集める
    # （JST 07/09/11/13/15/17/19/21 時 = UTC 22/00/02/04/06/08/10/12 時）。
    # 収集自体は 10 秒前後で終わるため、回数を増やしても Actions の時間はほとんど使わない
    - cron: "0 22,0,2,4,6,8,10,12 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install build tools
        run: npm ci
      - name: Build site (minify JS/CSS/HTML into docs/)
        run: npm run build
      - name: Collect
        run: node scripts/collect.mjs
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs data/state.json data/schedule-state.json
          git diff --cached --quiet && echo "no changes" && exit 0
          git commit -m "chore: collect $(TZ=Asia/Tokyo date +'%Y-%m-%d %H:%M JST')"
          git push
      # GITHUB_TOKEN による push は deploy ワークフローを起動しないので、ここでもアップロードする
      - name: Upload docs/ to Lolipop (FTP)
        if: ${{ vars.DEPLOY_TARGET == 'lolipop' }}
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.LOLIPOP_FTP_SERVER }}
          username: ${{ secrets.LOLIPOP_FTP_USER }}
          password: ${{ secrets.LOLIPOP_FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./docs/
          server-dir: ./public_html/
          dangerous-clean-slate: false
