# 毎日 1 回収集を実行し、docs/ を更新してコミットする（GitHub Pages は docs/ を配信）
name: collect

on:
  schedule:
    # 狙いは「30 分おきの更新」だが、cron をそのまま 30 分おきに置いても実現できない。
    # GitHub のスケジュール実行はベストエフォートで、混雑時は遅れるどころか配信されない
    # （このアカウントでは 2 時間おきの cron でも数時間止まることがあった。2026-09-17 実測）。
    #
    # そこで 10 分おきに起動し、下の「前回からの経過時間」ステップで 25 分たっていなければ
    # 即座に終了する。走るチャンスを 6 倍に増やしつつ、実際の収集は 30 分おきに保たれる
    # （空振りの回は数秒で終わり、外部へのリクエストも出さない）。
    - cron: "4,14,24,34,44,54 * * * *"
  workflow_dispatch:
  # 外部から叩くための入口。GitHub のスケジュール配信が当てにならないため、
  # 外の定期実行サービス（ロリポップの cron など）から 30 分おきにこれを叩く。
  # 叩き方は tools/trigger-collect.php（他プロジェクトと共通）を参照。
  repository_dispatch:
    types: [collect]

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      # 10 分おきの cron と外部トリガー（repository_dispatch）の両方で起動するので、
      # 前回の収集から間がないときはここで終わる。外部サービスが二重に叩いても
      # 余計な収集が走らない。手動実行（workflow_dispatch）だけは間隔を無視する。
      - name: 前回からの経過時間を見る
        id: gate
        env:
          MIN_GAP_MIN: 25
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "手動実行のため収集する"
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          LAST=$(node -e "try{process.stdout.write(require('./docs/radar/data/sites.json').updatedAt||'')}catch(e){}")
          if [ -z "$LAST" ]; then
            echo "前回の記録が無いため収集する"
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          GAP=$(( ( $(date -u +%s) - $(date -u -d "$LAST" +%s) ) / 60 ))
          echo "前回の収集: $LAST（${GAP} 分前 / しきい値 ${MIN_GAP_MIN} 分）"
          if [ "$GAP" -ge "$MIN_GAP_MIN" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "間がないので今回は何もしない"
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        if: steps.gate.outputs.run == 'true'
        with:
          node-version: 20
      # collect.mjs は Node の標準機能だけで動く（esbuild / sharp を使うのは build.mjs だけ）。
      # docs/ の HTML・JS・CSS はビルド済みのものがコミットされていて、site/ を変えたときは
      # deploy.yml が作り直すので、収集のたびに npm ci とビルドを回す必要はない。
      - name: Collect
        if: steps.gate.outputs.run == 'true'
        run: node scripts/collect.mjs
      - name: Commit and push
        if: steps.gate.outputs.run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs data/state.json data/schedule-state.json data/rankings-state.json data/trends-state.json
          git diff --cached --quiet && echo "no changes" && exit 0
          git commit -m "chore: collect $(TZ=Asia/Tokyo date +'%Y-%m-%d %H:%M JST')"
          git push
      # GITHUB_TOKEN による push は deploy ワークフローを起動しないので、ここでもアップロードする
      - name: Upload docs/ to Lolipop (FTP)
        if: ${{ steps.gate.outputs.run == 'true' && vars.DEPLOY_TARGET == 'lolipop' }}
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.LOLIPOP_FTP_SERVER }}
          username: ${{ secrets.LOLIPOP_FTP_USER }}
          password: ${{ secrets.LOLIPOP_FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./docs/
          server-dir: ./pubhtml/
          dangerous-clean-slate: false
