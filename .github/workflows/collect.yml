# 毎日 1 回収集を実行し、docs/ を更新してコミットする（GitHub Pages は docs/ を配信）
name: collect

on:
  schedule:
    - cron: "0 22 * * *" # JST 07:00
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Collect
        run: node scripts/collect.mjs
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/sites.json data/state.json
          git diff --cached --quiet && echo "no changes" && exit 0
          git commit -m "chore: daily collect $(date -u +%Y-%m-%d)"
          git push
